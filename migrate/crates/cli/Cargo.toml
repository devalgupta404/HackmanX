[package]
name = "bootshift-migrate-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "bootshift-migrate"
path = "src/main.rs"

[features]
# Enables the live tracker-driven migration (send --track), which needs the eBPF tracker.
ebpf = ["bootshift-migrate-track/ebpf"]

[dependencies]
anyhow.workspace = true
clap.workspace = true
blake3.workspace = true
bootshift-disk.workspace = true
bootshift-migrate-core = { path = "../core" }
bootshift-migrate-net = { path = "../net" }
bootshift-migrate-receive = { path = "../receive" }
bootshift-migrate-track = { path = "../track" }
