[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.9
unused-allowed-license = "allow"
allow = [
    "GPL-3.0-or-later",
    "LGPL-2.1-or-later",
    "MPL-2.0",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "Unicode-3.0",
]
# Font licences, only for the crate that ships egui's built-in fonts. Fonts are data shipped
# beside the program, not code linked into it. The fonts the GUI bundles itself carry the same
# licences; their texts are in crates/gui/assets/fonts.
exceptions = [
    { crate = "epaint_default_fonts", allow = ["OFL-1.1", "Ubuntu-font-1.0"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
