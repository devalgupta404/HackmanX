[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
repository = "https://github.com/devalgupta404/HackmanX"
publish = false

[workspace.dependencies]
thiserror = "2.0"
crc32c = "0.6"
blake3 = "1.5"
gptman = { version = "3.1", default-features = false }
rustix = { version = "1", features = ["fs", "system", "mount"] }
tempfile = "3"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_with = { version = "3", default-features = false, features = ["macros"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
proptest = "1.5"

bootshift-core = { path = "crates/core" }
bootshift-disk = { path = "crates/disk" }
bootshift-fs = { path = "crates/fs" }
bootshift-boot = { path = "crates/boot" }
bootshift-engine = { path = "crates/engine" }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
# Lists of byte ranges are everywhere here, so one-element lists are intentional.
single_range_in_vec_init = "allow"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
